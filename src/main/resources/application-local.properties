spring.datasource.url=${DB_URL:jdbc:h2:file:./data/rememberfit;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=false

spring.flyway.baseline-on-migrate=false

# 로컬 개발 전용 키. 운영에서는 JWT_SECRET 환경 변수를 반드시 설정한다.
app.jwt.secret=${JWT_SECRET:local-development-only-secret-key-change-me}
