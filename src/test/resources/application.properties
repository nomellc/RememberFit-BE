spring.datasource.url=jdbc:h2:mem:rememberfit;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

app.cors.allowed-origins=http://localhost:8081

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false

app.jwt.secret=test-only-secret-key-for-rememberfit-suite
app.jwt.access-token-ttl=PT1H
app.jwt.refresh-token-ttl=P30D
