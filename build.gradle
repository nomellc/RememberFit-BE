plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
	id 'info.solidsoft.pitest' version '1.15.0'
}

group = 'com.rememberfit'
version = '1.0.0'
description = 'RememberFit spaced-repetition API'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.flywaydb:flyway-core'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'com.mysql:mysql-connector-j'
	runtimeOnly 'org.flywaydb:flyway-mysql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy tasks.jacocoTestReport
}

jacoco {
	toolVersion = '0.8.12'
}

tasks.named('jacocoTestReport') {
	dependsOn tasks.test
	reports {
		xml.required = true
		html.required = true
	}
}

pitest {
	junit5PluginVersion = '1.2.1'
	targetClasses = ['com.rememberfit.backend.domain.*']
	outputFormats = ['HTML', 'XML']
	timestampedReports = false
	threads = 4
	// 현재 실측값은 mutation 100%, test strength 100%, line 98%.
	// 여유를 두되 지표가 눈에 띄게 내려가면 PR을 막는다.
	mutationThreshold = 95
	testStrengthThreshold = 95
	coverageThreshold = 90
}
